# The C ABI over `quieditor_engine`, one `#[no_mangle] extern "C"` function per
# operation.
#
# A library, not an artifact. It carries no `cdylib`, because producing one
# decides how a shared object is named and linked on each platform, and this
# crate has no business deciding that — a caller that wants a `.dylib` wraps
# this one and says so itself. Two do: the editor, in its own repository, and
# `crates/wasm` here.
#
# `rlib` is what those two need in order to depend on this at all, and it is the
# reason this crate is not also the wasm module: a `cdylib`-only crate provides
# no linkable target, so nothing can be built on top of it.
[package]
name = "quieditor_ffi"
description = "The C ABI over quieditor_engine, for callers outside Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `staticlib` so that a C caller can link the ABI with no Rust in its build.
crate-type = ["staticlib", "rlib"]

[dependencies]
quieditor_engine.workspace = true
flatbuffers.workspace = true
