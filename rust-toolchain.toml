# Pin an exact version rather than a channel so builds are reproducible.
# `native_toolchain_rust` rejects `stable` / `beta` / `nightly` for this reason.
#
# One file for the workspace. There used to be a second one beside the shim,
# because the build hook reads the toolchain next to the crate it builds and the
# shim lived in another repository; both crates are here now, so this one is the
# one the hook finds and the one a bare `cargo test` reads.
[toolchain]
channel = "1.95.0"
# Named rather than left to whatever rustup happens to have. A runner resolves
# this toolchain from nothing, and `cargo fmt` there failed with `cargo-fmt is
# not installed` — the targets below are installed because they are listed, and
# the same is true of these. CI is also the reason they are here at all: on a
# machine that already had them, their absence was invisible.
components = ["rustfmt", "clippy"]
targets = [
  # Android
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",

  # iOS (device + simulator)
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",

  # Windows
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",

  # Linux
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",

  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",

  # The browser. The only target here that is not a platform Flutter links a
  # static library into — the module is fetched at run time instead, which is
  # why it is built `--profile wasm` rather than `--release`.
  "wasm32-unknown-unknown",
]
